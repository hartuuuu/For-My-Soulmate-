<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Section 1: Main Dark Video Container / Scroll Flow */
    #main-flow {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #000000;
      padding: 40px 20px;
      gap: 60px;
    }

    .video-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9 / 16;
      background: #050505;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* Prevents pause/fast-forward clicks */
    }

    /* Corner Replay Button */
    .replay-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s, background-color 0.2s;
    }

    .replay-btn:hover {
      transform: scale(1.1);
      background: rgba(0, 0, 0, 0.85);
    }

    .video-label {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 10;
    }

    /* End Message Section */
    .end-message-container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 40px 20px;
      margin-top: 20px;
      cursor: pointer;
    }

    .end-message {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0e0e0;
      user-select: none;
    }

    .click-hint {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #888;
    }

    /* Section 2: Last Page / Photo Background Screen */
    #last-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000 url('end-photo_2.png') center center / contain no-repeat;
      z-index: 100;
      cursor: pointer;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <!-- Scrollable Media & Message Flow -->
  <div id="main-flow">
    
    <!-- Video 1 -->
    <div class="video-card">
      <span class="video-label">Video1</span>
      <video id="vid1" playsinline autoplay muted loop src="Video1.mp4"></video>
      <button class="replay-btn" onclick="restartVideo('vid1')">↺</button>
    </div>

    <!-- Video 2 -->
    <div class="video-card">
      <span class="video-label">Video2</span>
      <video id="vid2" playsinline autoplay muted loop src="Video2.mp4"></video>
      <button class="replay-btn" onclick="restartVideo('vid2')">↺</button>
    </div>

    <!-- Message at the bottom -->
    <div class="end-message-container" onclick="goToLastPage()">
      <p class="end-message">
        Once again, happy birthday! Happy 20th birthday! And that’s the end of the website lol. There’s nothing more HAHAHAHA.
      </p>
      <p class="click-hint">(Tap anywhere here to continue)</p>
    </div>

  </div>

  <!-- Final Screen -->
  <div id="last-page" onclick="restartWebsite()">
    <canvas id="confetti-canvas"></canvas>
  </div>

  <script>
    // Restart video functionality
    function restartVideo(id) {
      const vid = document.getElementById(id);
      if (vid) {
        vid.currentTime = 0;
        vid.play();
      }
    }

    // Switch to Final Page
    function goToLastPage() {
      document.getElementById('main-flow').style.display = 'none';
      const lastPage = document.getElementById('last-page');
      lastPage.style.display = 'block';
      window.scrollTo(0, 0);
      startConfetti();
    }

    // Global Restart back to start
    function restartWebsite() {
      stopConfetti();
      document.getElementById('last-page').style.display = 'none';
      document.getElementById('main-flow').style.display = 'flex';
      window.scrollTo(0, 0);
    }

    // Simple Falling Confetti Animation
    let confettiAnimationId;
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 45 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 6 + 4,
        speedY: Math.random() * 2 + 1,
        speedX: Math.random() * 1 - 0.5,
        color: `hsl(${Math.random() * 360}, 70%, 75%)`
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          
          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }

          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        confettiAnimationId = requestAnimationFrame(render);
      }

      render();
    }

    function stopConfetti() {
      cancelAnimationFrame(confettiAnimationId);
    }
  </script>
</body>
</html>
